services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    ports:
      - "5432:5432"
    volumes:
      - personal_schedule_postgres:/var/lib/postgresql/data
      - ./.docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d personal_schedule"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  personal_schedule_postgres:
