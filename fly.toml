app = 'sched-ued'
primary_region = 'ord'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  WORKER_ENABLED = 'true'
  TRUST_PROXY_HOPS = '1'
  WEB_ORIGIN = 'https://sched-ued.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
