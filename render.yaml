services:
  - type: web
    name: unirhythm
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: unirhythm-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WORKER_ENABLED
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENCRYPTION_KEY
        value: 534wAWr4w19uKuA6K7Ihsd+0b5+qoL5JHCc2tDEeifE=

databases:
  - name: unirhythm-db
    databaseName: unirhythm
    user: unirhythm
    plan: free
    region: singapore
